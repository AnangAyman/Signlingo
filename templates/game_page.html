<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignLingo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game_style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Assets/logo.png') }}">
</head>
<body>
    <button class="back-button" onclick="window.location.href='/dashboard'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div class="top-right-stats">
        <div class="xp-display" id="xp-badge">
            <i class="fas fa-bolt" style="color: #FFA500;"></i>
            <span id="xp-count">0 XP</span>
        </div>
        <div class="lives-display">
            <i class="fas fa-heart" style="color: #ff4b4b;"></i>
            <span id="lives-count">{{user.lives}}</span>
        </div>
    </div>
    
    <div class="game-page-wrapper">
        <div class="quiz-card" data-lesson-key="{{ active_step.step_key if active_step else 'KEY_NOT_FOUND' }}">
            <div class="game-header">
                <div class="header-text">
                    <span class="module-badge">Practice</span>
                    <h1>{{ active_step.lesson.title if active_step else "Practice" }}</h1>
                </div>
                <div class="progress-info">
                    <span class="progress-label">Module Progress</span>
                    <div class="module-progress-container">
                        <div class="module-progress-bar" style="width: {{ module_progress_percent }}%;"></div>
                    </div>
                </div>
            </div>

            <div class="quiz-progress-container">
                <div class="quiz-progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="quiz-visual-area">
                <div class="loading-spinner" id="loading-spinner"></div>
                <img id="sign-image" src="{{ url_for('static', filename='Assets/great_job.png') }}" alt="Sign Language Image" class="sign-image-style">
            </div>

            <div id="question" class="question-text">Loading question...</div>
            
            <div id="choices" class="choices-grid"></div>

        </div>
    </div>

    <div id="feedback-banner" class="feedback-banner">
        <div class="feedback-content">
            <span class="feedback-icon">
                <i class="fa-solid fa-circle-check"></i>
                <i class="fa-solid fa-circle-xmark"></i>
            </span>
            <p id="feedback" class="feedback-text"></p>
        </div>
    </div>

    <audio id="correct-sound" src="{{ url_for('static', filename='sounds/correct.mp3') }}" preload="auto"></audio>
    <audio id="incorrect-sound" src="{{ url_for('static', filename='sounds/incorrect.mp3') }}" preload="auto"></audio>

    <button class="skip-button" id="skip-button">
        <i class="fa-solid fa-forward"></i>
        Skip Practice
    </button>

    <!-- Skip Confirmation Modal -->
    <div class="modal-overlay" id="skip-modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="modal-title">Skip this practice?</h3>
            <p class="modal-text">You won't earn any XP if you skip. Are you sure you want to continue?</p>
            <div class="modal-actions">
                <button class="modal-button cancel-button" id="cancel-skip">Cancel</button>
                <button class="modal-button confirm-button" id="confirm-skip">Skip Practice</button>
            </div>
        </div>
    </div>

    <!-- Out of Lives Modal -->
    <div class="modal-overlay" id="out-of-lives-modal">
        <div class="modal-content modal-large">
            <div class="modal-icon modal-icon-heart">
                <i class="fa-solid fa-heart-crack"></i>
            </div>
            <h3 class="modal-title">You're out of lives!</h3>
            <p class="modal-text">Choose an option to continue learning:</p>
            
            <div class="lives-options">
                <button class="modal-button premium-button" onclick="window.location.href='/premium'">
                    <i class="fa-solid fa-crown"></i>
                    Get Premium
                </button>
                
                <button class="modal-button ad-button" id="watch-ad-button">
                    <i class="fa-solid fa-video"></i>
                    Watch an Ad
                </button>
                
                <button class="modal-button secondary-full-button" onclick="window.location.href='/dashboard'">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Dashboard
                </button>
            </div>
        </div>
    </div>
    

    <script src="{{ url_for('static', filename='js/game_logic.js') }}"></script>
</body>
</html>
